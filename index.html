<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medemer Philosophy Quiz - 130 MCQs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans Ethiopic', sans-serif;
            background-color: #f3f4f6;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .correct-answer {
            background-color: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
        }
        .wrong-answer {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }
        .disabled-option {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

    <!-- Main Container -->
    <div id="app-container" class="bg-white rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden min-h-[500px] flex flex-col relative">
        
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-6 text-center">
            <h1 class="text-2xl font-bold tracking-tight">የመደመር ፍልስፍና ጥያቄዎች</h1>
            <p class="text-indigo-100 mt-1 text-sm">Medemer Philosophy Comprehensive Quiz</p>
        </header>

        <!-- Error Toast (Replaces alert) -->
        <div id="toast" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-4 py-2 rounded shadow-lg hidden z-50 transition-opacity">
            <span id="toast-message"></span>
        </div>

        <!-- 1. Authentication / Welcome Screen -->
        <div id="welcome-screen" class="p-8 flex-grow flex flex-col justify-center fade-in">
            <div class="max-w-md mx-auto w-full">
                <h2 class="text-xl font-semibold mb-6 text-gray-700 text-center">Student Identification</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name / ሙሉ ስም</label>
                        <input type="text" id="student-name" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow" placeholder="Abebe Kebede">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ID Number / መለያ ቁጥር</label>
                        <input type="text" id="student-id" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow" placeholder="UGR/1234/15">
                    </div>
                    <button onclick="startQuiz()" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors">
                        Start Quiz / ፈተናውን ጀምር
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. Quiz Screen -->
        <div id="quiz-screen" class="p-6 md:p-8 flex-grow flex flex-col hidden fade-in">
            <!-- Progress and Status -->
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-200">
                <div class="text-sm font-medium text-gray-500">
                    Question <span id="current-q-num" class="text-indigo-600 font-bold text-lg">1</span> of <span id="total-q-num">130</span>
                </div>
                <div class="text-sm font-medium text-gray-500">
                    Score: <span id="current-score" class="text-green-600 font-bold text-lg">0</span>
                </div>
            </div>

            <!-- Question Area -->
            <div class="flex-grow">
                <h2 id="question-text" class="text-lg md:text-xl font-semibold text-gray-800 mb-6 leading-relaxed">
                    <!-- Question will be injected here -->
                </h2>

                <!-- Options -->
                <div id="options-container" class="space-y-3">
                    <!-- Options will be injected here -->
                </div>

                <!-- Instant Feedback & Explanation -->
                <div id="feedback-container" class="mt-6 p-4 rounded-lg hidden fade-in">
                    <h3 id="feedback-title" class="font-bold text-lg mb-2"></h3>
                    <div class="text-sm space-y-2">
                        <p id="feedback-amharic" class="text-gray-700 leading-relaxed font-medium"></p>
                        <p id="feedback-english" class="text-gray-600 leading-relaxed italic"></p>
                    </div>
                </div>
            </div>

            <!-- Navigation Controls -->
            <div class="mt-8 pt-4 border-t border-gray-200 flex justify-between items-center">
                <button onclick="prevQuestion()" id="btn-prev" class="px-5 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    &larr; Back
                </button>
                
                <button onclick="nextQuestion()" id="btn-next" class="px-5 py-2.5 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition-colors">
                    Skip / Next &rarr;
                </button>

                <button onclick="submitQuiz()" id="btn-submit" class="px-5 py-2.5 rounded-lg bg-green-600 text-white font-medium hover:bg-green-700 transition-colors hidden">
                    Submit Quiz
                </button>
            </div>
        </div>

        <!-- 3. Results Dashboard Screen -->
        <div id="result-screen" class="p-8 flex-grow flex flex-col items-center justify-center hidden fade-in text-center">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-6">
                <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Quiz Completed!</h2>
            <p class="text-gray-500 mb-8">Here is your summary, <span id="summary-name" class="font-semibold text-gray-800"></span> (<span id="summary-id"></span>).</p>
            
            <div class="bg-gray-50 rounded-xl p-6 w-full max-w-sm mb-8 border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-gray-600 font-medium">Final Score:</span>
                    <span id="final-score-val" class="text-2xl font-bold text-indigo-600">0/130</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="score-bar" class="bg-indigo-600 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
                <div class="mt-4 text-right">
                    <span id="final-percentage" class="text-sm font-semibold text-gray-600">0%</span>
                </div>
            </div>

            <div class="space-y-4 w-full max-w-sm">
                <button onclick="sendScoresToTeacher()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    Send Score to Teacher
                </button>
            </div>
        </div>

    </div>

    <script>
        // 130 Question Bank (Parsed from the Medemer Document requirements)
        // Format: [Question, OptionA, OptionB, OptionC, OptionD, CorrectIndex (0-3)]
        const rawData = [
            ["የሰው ልጅን ፍላጎት ሁሉ የሚመራው መሠረታዊ ፍላጎት ምንድነው?", "ሀብት የማከማቸት ፍላጎት", "ዝናን የማትረፍ ፍላጎት", "ህልውናን የማረጋገጥ ፍላጎት", "ስልጣን የመያዝ ፍላጎት", 2],
            ["ቀጥተኛ የህልውና ፍላጎት የሚባለው የትኛው ነው?", "የመብላትና የመጠጣት ፍላጎት", "ከግልጽና ቅርብ አደጋ ራስን ማዳን", "የመማር ፍላጎት", "የክብርና የስም ፍላጎት", 1],
            ["ከሚከተሉት ውስጥ ተዘዋዋሪ የህልውና ፍላጎት ያልሆነው የቱ ነው?", "የስም ፍላጎት", "የነጻነት ፍላጎት", "ሥጋዊ ፍላጎት", "ከጦርነት ራስን መከላከል", 3],
            ["ሥጋዊ ፍላጎት በዋናነት ምንን ያካትታል?", "የእኩልነት ጥያቄ", "የመብላት፣ የመጠጣትና የመጠለል ፍላጎት", "ከእስር የመላቀቅ ፍላጎት", "የመከበር ፍላጎት", 1],
            ["የማንነት ጥያቄዎች ከየትኛው ፍላጎት ጋር ይያያዛሉ?", "ከቀጥተኛ ህልውና ፍላጎት", "ከኢኮኖሚያዊ ፍላጎት", "ከስም (ክብር) ፍላጎት", "ከሥጋዊ ፍላጎት", 2],
            ["ነጻነት ማለት በመሠረቱ ምንድነው?", "ሀብት ማካበት", "ከሌሎች በላይ ሆኖ መታየት", "በሕይወት አማራጮች ራስን መወሰን", "ሁሉንም ሰው እኩል ማድረግ", 2],
            ["በመደመር ፍልስፍና የሰው ልጅ ፍላጎቶች ምን ዓይነት ባሕርይ አላቸው?", "ተደማሪና እርስ በርስ የተሳሰረ", "የተነጣጠለ", "ቅደም ተከተል ያለው", "አንዱ ሲሟላ ሌላው የሚጠፋ", 0],
            ["ዜጎችን ከጥቃት ለመከላከል የሚደረግ ቁጥጥር የትኛውን ፍላጎት ሊያጓድል ይችላል?", "ሥጋዊ ፍላጎትን", "የማንነት ፍላጎትን", "የነጻነት ፍላጎትን", "የመጠለል ፍላጎትን", 2],
            ["ዜጎችን እኩል ለማድረግ በሀብት ላይ ገደብ መጣል ምንን ሊያጓድል ይችላል?", "ሥጋዊ ፍላጎትን", "ቀጥተኛ የህልውና ፍላጎትን", "የስም ፍላጎትን", "የነጻነት ፍላጎትን", 3],
            ["በሀገራችን ታሪክ ህልውናን ለማረጋገጥ ስንጓዝ የትኛውን ፍላጎት ችላ ብለናል?", "ቀጥተኛ የህልውና ጥያቄን", "የውጭ ወረራ መከላከልን", "የጦር መሣሪያ ማዘመንን", "የስምና የነጻነት ጥያቄን", 3],
            ["ስለሰው ልጅ አቅም 'ሥነ ሕይወታዊ' ዕይታ ምን ያምናል?", "በምርጫው ይለወጣል", "አካባቢውን ሙሉ በሙሉ ይቆጣጠራል", "ነጻ ፈቃድ አለው", "ዕጣ ፈንታው በተፈጥሮ የተወሰነ ነው", 3],
            ["የሰው ልጆች ከአካባቢያቸው ጋር ባላቸው መስተጋብር ዕጣ ፈንታቸውን ይወስናሉ የሚለው ዕይታ?", "የድርጊትና ምላሽ ዕይታ", "የተፈጥሮ ሕግ ዕይታ", "የመለኮታዊ ጣልቃ ገብነት ዕይታ", "የሥነ ሕይወት ዕይታ", 0],
            ["በመደመር ፍልስፍና የሰው ልጅ ነጻ ፈቃድ ምን ዓይነት ነው?", "በሥነ ሕይወት የተወሰነ", "ሙሉ በሙሉ የተገደበ", "ከአካባቢ ተጽዕኖ ነጻ የሆነ", "እያደገ የሚሄድና ተፈጥሮን የሚያሸንፍ", 3],
            ["በመደመር መነጽር የሰው ልጅ ተፈጥሮ እንዴት ይገለጻል?", "ተፈጥሮው የማይለወጥ", "ሙሉ በሙሉ መልካምና ተባባሪ", "ለበጎነትም ለክፋትም ክፍት የሆነ", "ሙሉ በሙሉ ጨካኝና ራስ ወዳድ", 2],

            ["መግደርደር በባህላችን የትኞቹን ፍላጎቶች ግጭት ያሳያል?", "የሀብትና የሥልጣን", "የነጻነትና የእኩልነት", "ሥጋዊና የስም ፍላጎት", "ቀጥተኛና ተዘዋዋሪ ህልውና", 2],

            ["ሊበራሊዝም ለየትኛው የሰው ልጅ ፍላጎት ቅድሚያ ይሰጣል?", "ለባህል ግንባታ", "ለእኩልነት ፍላጎት", "ለማኅበራዊ ደኅንነት", "ለነጻነት ፍላጎት", 3],

                btnSubmit.className = hasAnswered 
                    ? "px-5 py-2.5 rounded-lg bg-green-600 text-white font-medium hover:bg-green-700 transition-colors" 
                    : "px-5 py-2.5 rounded-lg bg-gray-400 text-white font-medium cursor-not-allowed";
            } else {
                btnNext.classList.remove('hidden');
                btnSubmit.classList.add('hidden');
                // Change Next to Skip if not answered
                btnNext.innerHTML = hasAnswered ? 'Next &rarr;' : 'Skip &rarr;';
                btnNext.className = hasAnswered 
                    ? "px-5 py-2.5 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition-colors"
                    : "px-5 py-2.5 rounded-lg bg-gray-400 text-white font-medium hover:bg-gray-500 transition-colors";
            }
        }

        function selectOption(selectedIndex) {
            const q = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.answer;
            
            userAnswers[currentQuestionIndex] = selectedIndex;
            
            if (isCorrect) score++;
            
            // Re-render to show correct/wrong state without completely reloading
            loadQuestion(currentQuestionIndex);
        }

        function showFeedback(isCorrect, correctText) {
            feedbackContainer.classList.remove('hidden');
            if (isCorrect) {
                feedbackContainer.className = "mt-6 p-4 rounded-lg fade-in bg-green-50 border border-green-200";
                feedbackTitle.className = "font-bold text-lg mb-2 text-green-700";
                feedbackTitle.textContent = "✓ Correct! / ትክክል!";
                
                feedbackAmharic.textContent = `መልሱ "${correctText}" ነው። በ'መደመር' ፍልስፍና መሠረት ይህ ጽንሰ ሀሳብ ለማህበራዊና ሀገራዊ ግንባታ ቁልፍ ሚና ይጫወታል።`;
                feedbackEnglish.textContent = `The answer is "${correctText}". According to the Medemer philosophy, this concept plays a key role in social and national building.`;
            } else {
                feedbackContainer.className = "mt-6 p-4 rounded-lg fade-in bg-red-50 border border-red-200";
                feedbackTitle.className = "font-bold text-lg mb-2 text-red-700";
                feedbackTitle.textContent = "✗ Incorrect / ስህተት";
                
                feedbackAmharic.textContent = `ትክክለኛው መልስ "${correctText}" ነው። የመደመር ዕይታ በዚህ ጉዳይ ላይ የሚያተኩረው የችግሩን ሥረ-መሰረት ለመፍታት እና ሚዛናዊ አቋም ለመያዝ ነው።`;
                feedbackEnglish.textContent = `The correct answer is "${correctText}". The Medemer perspective focuses on resolving the root cause of this issue and maintaining a balanced approach.`;
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                loadQuestion(currentQuestionIndex - 1);
            }
        }

        function submitQuiz() {
            // Check if there are unanswered questions
            const unansweredCount = userAnswers.filter(a => a === null).length;
            if (unansweredCount > 0) {
                const proceed = confirm(`You have ${unansweredCount} unanswered questions. Are you sure you want to submit?`);
                if (!proceed) return;
            }

            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            document.getElementById('summary-name').textContent = userName;
            document.getElementById('summary-id').textContent = userId;
            document.getElementById('final-score-val').textContent = `${score}/${questions.length}`;
            
            const percentage = (score / questions.length) * 100;
            document.getElementById('score-bar').style.width = `${percentage}%`;
            document.getElementById('final-percentage').textContent = `${percentage.toFixed(1)}%`;
        }

        function sendScoresToTeacher() {
            const percentage = ((score / questions.length) * 100).toFixed(1);
            const subject = encodeURIComponent(`Medemer Quiz Results: ${userName} - ${userId}`);
            
            let bodyText = `Hello,\n\nHere are the final quiz results submitted from the Medemer Philosophy Quiz Application:\n\n`;
            bodyText += `Student Details:\n`;
            bodyText += `Name: ${userName}\n`;
            bodyText += `ID: ${userId}\n\n`;
            bodyText += `Score Summary:\n`;
            bodyText += `Correct Answers: ${score} out of ${questions.length}\n`;
            bodyText += `Percentage Score: ${percentage}%\n\n`;
            bodyText += `Unanswered Questions: ${userAnswers.filter(a => a === null).length}\n\n`;
            bodyText += `Thank you.`;

            const body = encodeURIComponent(bodyText);
            
            window.location.href = `mailto:mesayferedegn2@gmail.com?subject=${subject}&body=${body}`;
        }
    </script>
</body>
</html>
